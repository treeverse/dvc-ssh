---
version: '3.2'
services:
  openssh-server:
    image: ghcr.io/linuxserver/openssh-server
    environment:
      - PASSWORD_ACCESS=true
      - USER_NAME=user
      - USER_PASSWORD=password
      - PUBLIC_KEY_FILE=/tmp/key
      - PASSWORD_ACCESS=true
    ports:
      - 2222
    volumes:
      - ./user.key.pub:/tmp/key

